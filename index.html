<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Run Monitor" />
    <meta name="description" content="Aplicación para gestionar equipos de trabajo, registrar encendido/apagado, generar imágenes con IA y chat de soporte." />
    <meta property="og:title" content="Run Monitor" />
    <meta property="og:description" content="Aplicación para gestionar equipos de trabajo, registrar encendido/apagado, generar imágenes con IA y chat de soporte." />
    <link rel="icon" type="image/svg+xml" href="/encendido.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <title>Run Monitor</title>
  </head>
  <body>
    <div id="root">
      <!-- Fallback visual mientras inicia React -->
      <div id="loading-fallback" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif;">
        <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(to bottom, #00FFFF, #60A5FA);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);margin-bottom:16px;">
          <div style="width:36px;height:36px;border:4px solid #000;border-top-color:transparent;border-radius:50%;"></div>
        </div>
        <h2 style="font-size:26px;font-weight:bold;margin:0 0 8px 0;color:#0f172a;">Run<span style="color:#00b4d8;">Monitor</span></h2>
        <p id="loading-fallback-text" style="font-size:12px;color:#64748b;margin:0;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;">Iniciando sistema...</p>
        <button id="fallback-reload-btn" onclick="clearAndReload()" style="display:none;margin-top:20px;padding:10px 24px;border-radius:9999px;background:#0284c7;color:#fff;border:none;font-weight:700;font-size:12px;text-transform:uppercase;cursor:pointer;letter-spacing:0.05em;box-shadow:0 4px 12px rgba(2,132,199,0.3);">Recargar Aplicación</button>
      </div>
    </div>
    <script>
      function clearAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            window.location.reload(true);
          }).catch(function() {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
      // If JS does not mount after 3.5s, offer manual reload button
      setTimeout(function() {
        var btn = document.getElementById('fallback-reload-btn');
        var text = document.getElementById('loading-fallback-text');
        if (btn && document.getElementById('loading-fallback')) {
          btn.style.display = 'inline-block';
          if (text) text.innerText = '¿Problemas para entrar? Toca para refrescar:';
        }
      }, 3500);
      // Auto-recover from chunk preload errors
      window.addEventListener('vite:preloadError', function() {
        clearAndReload();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
